name: Deploy TarjimCall signaling Worker
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      # Direct npx instead of cloudflare/wrangler-action: the wrapper swallowed
      # wrangler's own error output, leaving only "npx failed with exit code 1".
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@3.90.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
